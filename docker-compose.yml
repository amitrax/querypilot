services:
  db:
    image: postgres:16-alpine
    container_name: querypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: querypilot_password
      POSTGRES_DB: querypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querypilot-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://querypilot:querypilot_password@db:5432/querypilot
      SECRET_KEY: ${SECRET_KEY:-production-secret-key-querypilot-256-bit-token}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_SIZE_MB: 25
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: querypilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
